<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Vivilomix - Reproductor</title>
    <style>
        /* Eliminar márgenes y ocupar toda la pantalla */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        /* Contenedor del video y la superposición */
        .video-container {
            position: relative;
            width: 100%;
            max-width: 1200px; /* Ajusta según prefieras */
            background: #000;
        }
        /* El elemento video ocupará todo el ancho */
        #video {
            width: 100%;
            display: block;
            background: #000;
        }
        /* Superposición con tu nombre */
        .watermark {
            position: absolute;
            top: 20px;      /* Distancia desde arriba */
            right: 20px;    /* Distancia desde la derecha */
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 2.5rem;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 20px;
            border-radius: 8px;
            pointer-events: none; /* Para que no interfiera con los controles */
            z-index: 10;
            user-select: none;
            /* Opcional: agregar un borde sutil */
            border: 1px solid rgba(255,255,255,0.2);
        }
        /* Para móviles, achicamos un poco la fuente */
        @media (max-width: 600px) {
            .watermark {
                font-size: 1.5rem;
                padding: 6px 12px;
                top: 10px;
                right: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="video-container">
        <!-- Reproductor de video -->
        <video id="video" controls width="100%" height="100%"></video>
        
        <!-- Tu nombre en la esquina superior derecha -->
        <div class="watermark">Vivilomix</div>
    </div>

    <!-- Cargar hls.js -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script>
        (function() {
            var video = document.getElementById('video');
            // Cambia esta URL por la que quieras reproducir
            var m3u8Url = 'https://rt-esp.rttv.com/live/rtesp/playlist_800Kb.m3u8';

            if (Hls.isSupported()) {
                var hls = new Hls();
                hls.loadSource(m3u8Url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    video.play().catch(function(e) {
                        console.log('Autoplay bloqueado, espera interacción del usuario.');
                    });
                });
                // Manejar errores (por si el stream no carga)
                hls.on(Hls.Events.ERROR, function(event, data) {
                    console.error('Error en HLS:', data);
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                // Safari nativo
                video.src = m3u8Url;
                video.addEventListener('loadedmetadata', function() {
                    video.play().catch(function(e) {
                        console.log('Autoplay bloqueado.');
                    });
                });
            } else {
                alert('Tu navegador no soporta reproducción HLS.');
            }
        })();
    </script>
</body>
</html>
