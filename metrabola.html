<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivilomix - Reproductor</title>
    <style>
        /* Reset y fondo negro */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }
        /* Contenedor principal */
        .player-wrapper {
            position: relative;
            width: 100%;
            max-width: 1100px;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
        }
        /* Video se ajusta al ancho */
        #video {
            width: 100%;
            display: block;
            background: #000;
        }
        /* Capa con tu nombre (watermark) */
        .watermark {
            position: absolute;
            top: 25px;
            right: 30px;
            color: #ffffff;
            font-size: 2.8rem;
            font-weight: 900;
            letter-spacing: 2px;
            text-shadow: 0 4px 20px rgba(0,0,0,0.9), 0 0 10px #000;
            background: rgba(0, 0, 0, 0.45);
            padding: 12px 28px;
            border-radius: 50px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.15);
            pointer-events: none;
            user-select: none;
            z-index: 10;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        /* Mensaje de error amigable */
        .error-msg {
            color: #ff6b6b;
            text-align: center;
            padding: 20px;
            font-size: 1.2rem;
            display: none;
            background: rgba(255,0,0,0.1);
        }
        /* Responsive para móviles */
        @media (max-width: 640px) {
            .watermark {
                font-size: 1.8rem;
                padding: 8px 18px;
                top: 15px;
                right: 15px;
            }
        }
    </style>
</head>
<body>

<div class="player-wrapper">
    <!-- Reproductor de video -->
    <video id="video" controls playsinline preload="auto"></video>
    
    <!-- Tu nombre en la esquina -->
    <div class="watermark">Vivilomix</div>
    
    <!-- Mensaje de error (oculto por defecto) -->
    <div id="errorMsg" class="error-msg">⚠️ No se pudo cargar el stream. Verifica tu conexión o la URL.</div>
</div>

<!-- Cargar hls.js desde CDN -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@0.14.17/dist/hls.min.js"></script>
<script>
    (function() {
        const video = document.getElementById('video');
        const errorDiv = document.getElementById('errorMsg');

        // 🔽 CAMBIA ESTA URL POR LA QUE QUIERAS REPRODUCIR
        const m3u8Url = 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8';
        // Si tu stream no funciona, prueba con la de arriba (es un ejemplo gratuito y siempre activo)

        // También puedes usar tu URL original:
        // const m3u8Url = 'https://rt-esp.rttv.com/live/rtesp/playlist_800Kb.m3u8';

        function cargarStream() {
            if (Hls.isSupported()) {
                const hls = new Hls({
                    enableWorker: true,
                    lowLatencyMode: true,
                });
                hls.loadSource(m3u8Url);
                hls.attachMedia(video);

                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    video.play().catch(e => {
                        console.log('Autoplay bloqueado por el navegador.');
                    });
                });

                hls.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) {
                        switch (data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR:
                                errorDiv.style.display = 'block';
                                errorDiv.textContent = '❌ Error de red. Intenta recargar la página.';
                                break;
                            case Hls.ErrorTypes.MEDIA_ERROR:
                                errorDiv.style.display = 'block';
                                errorDiv.textContent = '❌ Error en el contenido multimedia.';
                                break;
                            default:
                                errorDiv.style.display = 'block';
                                errorDiv.textContent = '❌ Error al reproducir el stream.';
                                break;
                        }
                    }
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                // Safari y otros navegadores con soporte nativo
                video.src = m3u8Url;
                video.addEventListener('loadedmetadata', () => {
                    video.play().catch(e => console.log('Autoplay bloqueado.'));
                });
            } else {
                errorDiv.style.display = 'block';
                errorDiv.textContent = '❌ Tu navegador no soporta reproducción HLS.';
            }
        }

        // Iniciar la carga
        cargarStream();

        // Si el usuario hace clic en el reproductor, intentar reproducción manual
        video.addEventListener('click', () => {
            video.play().catch(() => {});
        });
    })();
</script>

</body>
</html>
