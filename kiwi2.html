<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Stream Local - Sin Publicidad</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://content.jwplatform.com/libraries/IDzF9Zmk.js"></script>
    <script src="https://cdn.rawgit.com/jpillora/xhook/1.4.9/dist/xhook.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* Contenedor con relación 16:9 y tamaño máximo */
        #player-wrapper {
            width: 100%;
            max-width: 1280px;   /* Ajusta según prefieras */
            aspect-ratio: 16 / 9;
            background: #000;
        }
        #player {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div id="player-wrapper">
        <div id="player"></div>
    </div>

    <script>
        // 🔴 NUEVO STREAM (el que me pediste)
        var url = "https://proxy.cors.sh/https://d2jl8r92tdc3f1.cloudfront.net/out/v1/59419700344b4625b7cb0693ba265ea3/TVGindex_1.m3u8";
        
        // Las claves DRM anteriores ya no son necesarias para este stream,
        // pero dejo el interceptor por si acaso (no afecta).
        var key = atob("ZGF0YTphcHBsaWNhdGlvbi9vY3RldC1zdHJlYW07YmFzZTY0LDFDM0crb2x0bjY4a20xOS9rZXpUd3c9PQ==");
        var lang = "en";
        var audioTrackSet = false;

        $(document).ready(function() {
            // Interceptor para llaves de cifrado (solo aplica si el stream lo requiere)
            xhook.before(function(request) {
                if (request.url.includes('cbsi.live.ott.irdeto.com')) {
                    request.url = key;
                }
            });

            // Configuración del reproductor
            var player = jwplayer("player").setup({
                playlist: [{
                    "sources": [{
                        "default": true,
                        "type": "hls",
                        "file": url,
                        "label": "auto"
                    }]
                }],
                width: "100%",
                height: "100%",
                autostart: true,
                mute: false,
                controls: true
            });

            // Al hacer clic en el contenedor, entra en pantalla completa (interacción de usuario)
            $("#player-wrapper").on("click", function() {
                player.requestFullscreen();
            });
        });
    </script>
</body>
</html>
