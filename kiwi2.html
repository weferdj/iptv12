<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>TV 16:9 Fullscreen</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain; /* 16:9 fijo sin deformar */
            background: #000;
            display: block;
        }
    </style>
</head>
<body>
    <video id="video" controls autoplay muted playsinline></video>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script>
        const video = document.getElementById('video');
        // Usa esta URL con proxy CORS
        const streamUrl = 'https://proxy.cors.sh/https://d2jl8r92tdc3f1.cloudfront.net/out/v1/59419700344b4625b7cb0693ba265ea3/TVGindex_1.m3u8';

        if (Hls.isSupported()) {
            const hls = new Hls({ enableWorker: true, lowLatencyMode: true });
            hls.loadSource(streamUrl);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => {
                video.play().catch(e => console.warn('Autoplay bloqueado. Haz clic en play.'));
            });
            hls.on(Hls.Events.ERROR, (event, data) => {
                if (data.fatal) alert('Error al cargar el stream. Revisa la URL o el proxy.');
            });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = streamUrl;
            video.addEventListener('loadedmetadata', () => {
                video.play().catch(e => console.warn('Autoplay bloqueado.'));
            });
        } else {
            alert('Tu navegador no soporta HLS.');
        }
    </script>
</body>
</html>
